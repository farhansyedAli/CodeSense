<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0C" />
    <!-- apply the saved theme before React loads, so a light-theme user never sees a dark flash -->
    <script>try{var t=JSON.parse(localStorage.getItem("cs.theme"));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <title>CodeSense — Understand any Python codebase</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
